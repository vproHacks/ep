[project]
name = "epkit"
version = "0.1.0"
description = "Support code for the EP primer notebook: data bundle, analysis, rendering"
requires-python = ">=3.10"
dependencies = ["numpy", "plotly"]

# Deliberately minimal. `openep-py`, `scipy` and `pyvista` are needed only by
# epkit.data and epkit.bundle.build_bundle, which run offline; keeping them out
# of the install requirements is what lets this wheel be micropip-installed into
# the browser alongside the published notebook.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["epkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
